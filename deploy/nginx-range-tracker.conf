# Range tracker static SPA — drop in /etc/nginx/sites-available/range-tracker
# Enable: ln -sf /etc/nginx/sites-available/range-tracker /etc/nginx/sites-enabled/
# Remove default if it also binds :80: rm -f /etc/nginx/sites-enabled/default

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/range-tracker;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: serve index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|woff2?|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
