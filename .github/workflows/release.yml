name: Release LXC bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend and tarball
        run: |
          npm ci
          npm run build
          SKIP_NPM_CI=1 bash deploy/package-for-lxc.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/lxc-bundle/range-tracker-lxc.tar.gz
          generate_release_notes: true
